services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    extra_hosts:
      - "pdm:10.10.10.14"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:5173}
      PDM_SERVICE_URL: ${PDM_SERVICE_URL:-http://pdm:8000}
    restart: unless-stopped
