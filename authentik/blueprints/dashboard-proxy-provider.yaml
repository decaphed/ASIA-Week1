# authentik/blueprints/dashboard-proxy-provider.yaml — declarative Authentik
# bootstrap for the dashboard forward-auth gate. Auto-applied by
# authentik-worker from /blueprints/custom (docker-compose.auth.yml).
# Matches this repo's existing preference for config-as-tracked-files
# (see pdm/app/thresholds.yaml) over manual UI configuration — wiping and
# re-upping this stack reproduces the same provider/application/outpost
# with zero manual steps (docs/plan/2026-08-09-authentik-split-ct.md §7.9).
#
# Hostnames below (dashboard.home, auth.home, nodered.home) are HARDCODED
# LITERALS, same as authentik/traefik/dynamic/dynamic.yml — Authentik
# blueprints only read an env var where the YAML explicitly uses an !Env
# tag, and this blueprint doesn't use one. .env's AUTH_DASHBOARD_HOST/
# AUTH_AUTHENTIK_HOST/AUTH_NODERED_HOST are documentation-only. If you
# change a hostname, edit both this file and dynamic.yml by hand.
version: 1
metadata:
  name: dashboard-proxy-provider
entries:
  - model: authentik_providers_proxy.proxyprovider
    id: dashboard-proxy-provider
    identifiers:
      name: dashboard-proxy-provider
    attrs:
      mode: forward_single
      external_host: https://dashboard.home
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # Required at the pinned AUTHENTIK_TAG=2026.5.6 (see .env.auth.example
      # / docs/plan/2026-08-09-authentik-split-ct.md §3, §5.4) — no hedging
      # on "if the tag is past 2024.12", this version unconditionally needs
      # it.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: dashboard
    attrs:
      name: Dashboard
      slug: dashboard
      provider: !KeyOf dashboard-proxy-provider

  # Second forward_single provider/application, same pattern as
  # dashboard-proxy-provider above, gating the Node-RED flow editor at
  # nodered.home instead of the SPA at dashboard.home. forward_single scopes
  # its callback to the SAME host as the app it protects (see the
  # outpost-nodered router in dynamic.yml), so this needs its own provider
  # with its own external_host — one provider can't cover two hostnames.
  - model: authentik_providers_proxy.proxyprovider
    id: nodered-proxy-provider
    identifiers:
      name: nodered-proxy-provider
    attrs:
      mode: forward_single
      external_host: https://nodered.home
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: nodered
    attrs:
      name: Node-RED
      slug: nodered
      provider: !KeyOf nodered-proxy-provider

  # TEMPORARY: third forward_single provider/application, same pattern as
  # dashboard-proxy-provider above, gating the SAME dashboard SPA but at the
  # cloudflared quick-tunnel's public hostname instead of dashboard.home —
  # forward_single scopes to exactly one external_host (see the comment on
  # nodered-proxy-provider above), so reaching the dashboard from both
  # dashboard.home (LAN) and the public tunnel URL needs its own provider
  # for the tunnel host, not a reused/edited dashboard-proxy-provider.
  # Remove this whole block once there's a stable public domain instead.
  - model: authentik_providers_proxy.proxyprovider
    id: tunnel-proxy-provider
    identifiers:
      name: tunnel-proxy-provider
    attrs:
      mode: forward_single
      external_host: https://collaborative-visited-delhi-things.trycloudflare.com
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: tunnel-dashboard
    attrs:
      name: Dashboard (tunnel)
      slug: tunnel-dashboard
      provider: !KeyOf tunnel-proxy-provider

  # Updates the built-in embedded outpost, identified by its default name,
  # to add this provider and to correctly configure the browser-facing
  # Authentik URL.
  #
  # authentik_host is the host embedded in the browser-facing OAuth2
  # authorize redirect for the forward_single auth-start flow — verified
  # empirically (2026.5.6): the redirect literally reuses this value's
  # scheme+host, regardless of the incoming request's Host / X-Forwarded-Host,
  # of AUTHENTIK_HOST_BROWSER, and of Traefik's trustForwardHeader setting.
  # Now that TLS is live (docs/plan/2026-08-11-hardening.md), this MUST be
  # https://auth.home/ — leaving it http:// would still technically work
  # (Traefik's web entrypoint redirects http->https), but only by bouncing
  # the browser through an extra needless redirect hop, and the initial
  # http:// leg would carry cookies without the Secure flag being relevant
  # yet. It must resolve to auth.home either way, NOT
  # http://authentik-server:9000/ (the internal Docker service name), or
  # browsers get a redirect to a host they can't resolve.
  #
  # This does NOT break outpost-to-core communication for the EMBEDDED
  # outpost: it talks to core over a local Unix socket
  # (/dev/shm/authentik-core.sock), not by dialing authentik_host over the
  # network — confirmed by `getent hosts auth.home` failing inside the
  # container while the outpost ping endpoint still returns 204. (A
  # STANDALONE/external outpost is a different story: that one really
  # does need authentik_host to be network-reachable, since it's a
  # separate process making real HTTP calls back to core.) Because of this,
  # authentik_host_insecure (a TLS-verification flag for an outbound
  # connection to authentik_host) still doesn't apply here even under TLS —
  # there's no outbound connection to verify a cert on — and stays omitted.
  #
  # authentik_host_browser is also set to the same value for consistency /
  # in case other code paths do consult it, but it is NOT what fixes the
  # authorize redirect above — don't rely on it alone.
  #
  # NOTE: writing `config` here REPLACES the outpost's config object
  # wholesale — restate any default you care about, don't assume a partial
  # merge.
  - model: authentik_outposts.outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      providers:
        - !KeyOf dashboard-proxy-provider
        - !KeyOf nodered-proxy-provider
        - !KeyOf tunnel-proxy-provider
      config:
        # TEMPORARY: pinned to the current cloudflared quick-tunnel hostname
        # while there's no stable public domain — revert to https://auth.home/
        # once one exists (see git history), since a quick tunnel's hostname
        # changes on every restart and this has to be updated to match.
        authentik_host: https://collaborative-visited-delhi-things.trycloudflare.com/
        authentik_host_browser: https://collaborative-visited-delhi-things.trycloudflare.com/
