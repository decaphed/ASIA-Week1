# authentik/traefik/traefik.yml — Traefik STATIC configuration for the auth
# CT (docs/plan/2026-08-09-authentik-split-ct.md §5.3). Everything that
# changes per-request-routing (routers/services/middlewares) lives in the
# DYNAMIC config instead: authentik/traefik/dynamic/dynamic.yml.
#
# No api/dashboard section here deliberately — `--api.insecure` is a recon
# surface on a real edge node, not just a debugging convenience. Debug with
# `docker compose logs traefik` and `curl` instead.

entryPoints:
  # TLS reinstated — docs/plan/2026-08-09-authentik-split-ct.md §3 originally
  # cut this to avoid mkcert CA/cert maintenance, and the single-CT
  # consolidation plan carried that decision forward unchanged. Revisited and
  # reversed by explicit user request (session-authorized reopening of an
  # otherwise "not reopened here" decision) — see
  # docs/plan/2026-08-11-hardening.md. mkcert chosen specifically because
  # docs/runbook/authentik-operations.md §1 already fully documents the CA
  # issuance/distribution flow; this reuses it rather than inventing a new one.
  web:
    address: ":80"
    http:
      # Every plaintext request gets redirected, not just gated behind a
      # separate entrypoint — leaving :80 servable in parallel would make the
      # new websecure entrypoint optional-in-practice, defeating the point.
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
  # Loopback-only — never published, never routable from other containers
  # (see docker-compose.yml `edge` network). Exists solely so the
  # `traefik healthcheck --ping` CLI subcommand used by the compose-level
  # healthcheck has something to hit; deliberately not the api/dashboard
  # entrypoint this file's top comment already warns against exposing.
  ping:
    address: "127.0.0.1:8082"

ping:
  entryPoint: "ping"

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: INFO

# Persistent access log (not verification-only — see the plan's decision
# table §3). Written to /var/log/traefik inside the container, which
# docker-compose.auth.yml bind-mounts to ./authentik/traefik/logs on the
# host so it survives container recreation. This CT has no log rotation
# configured yet — see docs/runbook/authentik-operations.md for the
# logrotate config that MUST accompany this in production; without it the
# file grows unbounded.
accessLog:
  filePath: /var/log/traefik/access.log
