# authentik/traefik/dynamic/dynamic.yml — Traefik DYNAMIC configuration:
# routers, services, and the forward-auth middleware
# (docs/plan/2026-08-09-authentik-split-ct.md §5.3). File-provider only —
# no Docker socket is mounted anywhere in this stack (see the plan's
# "Why Traefik uses the file provider" section for why).

# mkcert leaf cert covering dashboard.home/auth.home/nodered.home — see
# docs/runbook/authentik-operations.md §1 for issuance and
# docs/plan/2026-08-11-hardening.md for why TLS came back after being
# deliberately dropped twice before. The file provider can't interpolate
# env vars into these paths (same limitation noted historically for the
# frontend IP in this file), so these are literals matching the volume
# mount in docker-compose.yml's traefik service.
tls:
  certificates:
    - certFile: /etc/traefik/certs/dashboard.home.pem
      keyFile: /etc/traefik/certs/dashboard.home-key.pem

http:
  services:
    client:
      loadBalancer:
        servers:
          # :8080, not :80 — client runs on nginxinc/nginx-unprivileged so
          # the container has no root process at all (see client/Dockerfile).
          - url: "http://127.0.0.1:8080"
        # Required so nginx on the client service receives the real Host
        # header (dashboard.home) to correctly proxy /api/ to Express —
        # NOT because the outpost needs it (the outpost reads
        # X-Forwarded-Host on its own forward-auth subrequest, computed by
        # Traefik from the original request, independent of this setting).
        passHostHeader: true

    authentik:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:9000"

    node-red:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:1880"

  middlewares:
    authentik-auth:
      forwardAuth:
        address: "http://127.0.0.1:9000/outpost.goauthentik.io/auth/traefik"
        # authentik's own Traefik forwardAuth reference config sets this
        # true: the EntryPoint sanitizes X-Forwarded-* from untrusted
        # clients, and trustForwardHeader:true is what makes Traefik
        # forward the (now-trustworthy) values on to the auth subrequest,
        # vs. legacy (false) behavior that drops some of them. Traefik is
        # the outermost hop here, so the EntryPoint's sanitizing has
        # nothing to strip — but this doesn't fix the browser-facing
        # OAuth2 authorize redirect host by itself; see the outpost
        # `authentik_host` comment in dashboard-proxy-provider.yaml for
        # what actually does.
        trustForwardHeader: true
        authResponseHeaders:
          - X-authentik-username
          - X-authentik-groups
          - X-authentik-email
          - X-authentik-name
          - X-authentik-uid

    # Applied to auth.home and the outpost callback paths — the most
    # sensitive surface (login form, token exchange), so the tightest
    # limit. average/period is a sustained rate (here: 1/s); burst is the
    # token-bucket ceiling for a legitimate page load's handful of asset
    # requests. Generous enough for a real login, tight enough to blunt a
    # credential-stuffing / flood attempt against the same endpoint.
    rl-auth:
      rateLimit:
        average: 60
        period: 1m
        burst: 30

    # Applied to the gated dashboard and Node-RED editor, AFTER login. Set
    # high enough for the dashboard's own polling (several GET endpoints
    # once a second per the client) without meaningfully constraining a
    # real user, while still capping an actual flood.
    rl-app:
      rateLimit:
        average: 240
        period: 1m
        burst: 80

    # Baseline browser hardening headers, applied to both gated apps. No CSP
    # here on purpose — see dashboard-csp below for why that's split out.
    security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: "same-origin"
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false

    # CSP only for the dashboard SPA — it's our own self-contained React
    # build with no external script/style/font sources (see client/src), so
    # a strict allowlist is safe. NOT applied to Node-RED: its editor is a
    # Monaco-based code editor that relies on inline scripts and dynamically
    # loaded node modules, and would likely break under this policy.
    dashboard-csp:
      headers:
        contentSecurityPolicy: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          connect-src 'self';
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self'

  routers:
    # Outpost callback path (login redirect target, logout, etc). Highest
    # priority: must win over the dashboard catch-all or the callback gets
    # swallowed by forward-auth and you get a redirect loop.
    outpost:
      # TEMPORARY: the trycloudflare.com alternative is the cloudflared
      # quick-tunnel hostname (see docker-compose.yml's AUTHENTIK_HOST_BROWSER
      # note) — remove once there's a stable public domain.
      rule: "(Host(`dashboard.home`) || Host(`collaborative-visited-delhi-things.trycloudflare.com`)) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 30
      entryPoints:
        - websecure
      tls: {}
      service: authentik
      middlewares:
        - rl-auth
      # No authentik-auth middleware attached — that would create a
      # redirect loop (the outpost's own auth check would gate the outpost).
      # rl-auth is safe here: it's a rate limit, not an auth check.

    # TEMPORARY: on dashboard.home/nodered.home, authentik's own login UI
    # (flow executor, OAuth2 authorize endpoint, its static assets) lives on
    # the SEPARATE, wholly-ungated auth.home host/router below — that's what
    # actually avoids the redirect loop, not the /outpost.goauthentik.io/
    # carve-out alone. The public tunnel only has ONE hostname, so it has to
    # serve both the gated dashboard AND authentik's own login UI on the SAME
    # host — this router exempts authentik's core paths there the same way
    # auth.home is exempt entirely. Remove once there's a stable second
    # public hostname to give auth.home its own router again.
    outpost-tunnel-core:
      rule: "Host(`collaborative-visited-delhi-things.trycloudflare.com`) && (PathPrefix(`/application/`) || PathPrefix(`/if/`) || PathPrefix(`/static/`) || PathPrefix(`/media/`) || PathPrefix(`/api/v3/`))"
      priority: 30
      entryPoints:
        - websecure
      tls: {}
      service: authentik
      middlewares:
        - rl-auth
      # No authentik-auth — same reasoning as `outpost` above: this IS
      # authentik's own login surface, gating it creates the loop.

    # Same callback carve-out as `outpost` above, but for the nodered.home
    # forward_single provider — forward_single's callback path lives on the
    # SAME host as the app it protects, so each protected host needs its own
    # outpost router, not just its own gated router.
    outpost-nodered:
      rule: "Host(`nodered.home`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 30
      entryPoints:
        - websecure
      tls: {}
      service: authentik
      middlewares:
        - rl-auth
      # No authentik-auth — same reasoning as `outpost` above.

    # Authentik's own UI (login flow, admin interface).
    authentik:
      rule: "Host(`auth.home`)"
      priority: 20
      entryPoints:
        - websecure
      tls: {}
      service: authentik
      middlewares:
        - rl-auth
      # No auth-check middleware — logging in requires reaching the login
      # page itself ungated. rl-auth is a rate limit, not an auth check.

    # The gated dashboard: SPA + (transitively, via nginx) /api/*.
    # rl-app runs first so a flood gets throttled before it ever reaches
    # the forward-auth subrequest (and authentik-server behind it).
    dashboard:
      # TEMPORARY: see the outpost router's note above.
      rule: "Host(`dashboard.home`) || Host(`collaborative-visited-delhi-things.trycloudflare.com`)"
      priority: 1
      entryPoints:
        - websecure
      tls: {}
      service: client
      middlewares:
        - rl-app
        - security-headers
        - dashboard-csp
        - authentik-auth

    # The gated Node-RED flow editor. Same forward-auth pattern as
    # `dashboard` — an unauthenticated Node-RED editor is effectively an
    # unauthenticated remote-code-execution panel (flows can run arbitrary
    # JS/shell), so it gets the same gate, not a lighter one.
    nodered:
      rule: "Host(`nodered.home`)"
      priority: 1
      entryPoints:
        - websecure
      tls: {}
      service: node-red
      middlewares:
        - rl-app
        - security-headers
        - authentik-auth
