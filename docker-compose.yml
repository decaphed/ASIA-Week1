services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_PATH: /data/data.db
      CLIENT_ORIGIN: http://localhost:5173
    volumes:
      - server_data:/data
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "5173:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  server_data:
