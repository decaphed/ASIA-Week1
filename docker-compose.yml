services:
  server:
    build: ./server
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      CLIENT_ORIGIN: http://localhost:5173
      PDM_SERVICE_URL: http://pdm:8000
    restart: unless-stopped
    depends_on:
      - pdm

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - server
    restart: unless-stopped

  pdm:
    build: ./pdm
    ports:
      - "8000:8000"
    restart: unless-stopped
