services:
  postgres:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      PDM_APP_PASSWORD: ${PDM_APP_PASSWORD:?PDM_APP_PASSWORD must be set}
      AUTHENTIK_PG_PASSWORD: ${AUTHENTIK_PG_PASSWORD:?AUTHENTIK_PG_PASSWORD must be set}
      # db/init/03-create-pdm-corpus-readonly-role.sh substitutes this into
      # the CREATE ROLE statement — without it here, that script creates
      # pdm_corpus_readonly with an empty-string password (the var is
      # simply unset in the container, not a hard failure, since this
      # script has no :? guard of its own).
      PDM_CORPUS_READONLY_PASSWORD: ${PDM_CORPUS_READONLY_PASSWORD:?PDM_CORPUS_READONLY_PASSWORD must be set}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No ports: — internal only. See §2 "Why postgres and pdm are not published".
    mem_limit: 1g
    cpus: 1.0
    # timescaledb/postgres entrypoint chowns the data dir and drops root ->
    # postgres via gosu on boot, so it needs these rather than a bare
    # cap_drop: ALL. Verify with a fresh-volume `docker compose up postgres`
    # after any base image bump.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    networks: [data]

  pdm:
    build: ./pdm
    restart: unless-stopped
    environment:
      # §10.5/§10.6 item 2 — read-only role scoped to training_corpus only
      # (see pdm/app/corpus.py's module docstring and db/init/03-create-
      # pdm-corpus-readonly-role.sh). Never DATABASE_URL/pdm_app — that
      # role is backend's, not pdm's.
      PDM_CORPUS_DB_URL: postgresql://pdm_corpus_readonly:${PDM_CORPUS_READONLY_PASSWORD:?PDM_CORPUS_READONLY_PASSWORD must be set}@postgres:5432/pump_telemetry
    # No ports: — internal only.
    volumes:
      # Shared physics RANGES (§11.6.1) — pdm/app/physics.py resolves this
      # to /pump-physics.yaml (three parents up from /app/app/physics.py in
      # the image). Build-context COPY can't reach this file since it lives
      # at the repo root, outside ./pdm's build context — bind-mount instead,
      # same convention as db/init and node-red/flow.json below.
      - ./pump-physics.yaml:/pump-physics.yaml:ro
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [data]

  backend:
    build: ./server
    depends_on:
      postgres:
        condition: service_healthy
      pdm:
        condition: service_healthy
    environment:
      PORT: 3000
      # Explicit, not just "happens to be unset" — requireGroup()
      # (server/middleware/authentikIdentity.js) fails closed on requests
      # with no Authentik identity unless NODE_ENV is development/test.
      NODE_ENV: production
      DATABASE_URL: postgres://pdm_app:${PDM_APP_PASSWORD}@postgres:5432/pump_telemetry
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-https://dashboard.home}
      PDM_SERVICE_URL: http://pdm:8000
      # Only trusted when paired with the matching secret client/nginx.conf.template
      # stamps on requests it proxies — see server/middleware/authentikIdentity.js
      # for why X-authentik-* headers alone aren't enough (node-red and any other
      # container on the edge network can reach backend:3000 directly).
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?INTERNAL_PROXY_SECRET must be set}
    volumes:
      # Shared physics RANGES (§11.6.1) — server/utils/validation.js resolves
      # this to /pump-physics.yaml (__dirname/../.. from /app/utils in the
      # image). Same reasoning as the pdm service's mount above.
      - ./pump-physics.yaml:/pump-physics.yaml:ro
    restart: unless-stopped
    # Renamed from "server" — see §2/§3. Directory stays ./server.
    # No ports: — Node-RED now runs internally (see node-red service below)
    # and posts to http://backend:3000/api/data over the Compose network, so
    # nothing outside this stack needs to reach backend directly anymore.
    # Previously published 3000:3000 for an external Node-RED host; that was
    # also, unintentionally, an unauthenticated LAN-wide path into every
    # /api/* route (not just the ingestion POST it was meant for), bypassing
    # Traefik + Authentik entirely. Removed at the source rather than bolted
    # shut with backend-side auth.
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [edge, data]

  client:
    build:
      context: ./client
      args:
        VITE_API_URL: /api
    environment:
      # Read by nginx.conf.template's envsubst pass at container start (see
      # client/Dockerfile) — must match backend's copy of the same var.
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?INTERNAL_PROXY_SECRET must be set}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # No ports: — reached only via Traefik at client:8080 (nginx-unprivileged,
    # non-root — see client/Dockerfile). See §2.
    healthcheck:
      # 127.0.0.1, not localhost — nginx only binds 0.0.0.0:8080 (the
      # unprivileged image's IPv6 auto-listen entrypoint script can't
      # rewrite default.conf, since it's root-owned and this runs as uid
      # 101), so "localhost" resolving IPv6-first to ::1 gets connection
      # refused with no IPv4 fallback in busybox wget.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.5
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [edge]

  node-red:
    image: nodered/node-red:4.0.9
    volumes:
      # The image's generated /data/settings.js hardcodes flowFile:
      # 'flows.json' (no env var for this in this version) — mount straight
      # to that name rather than trying to override it.
      - ./node-red/flow.json:/data/flows.json:ro
    # Image ships its own baked-in HEALTHCHECK (node /healthcheck.js) —
    # no compose-level healthcheck: needed/added here.
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    # No ports: — editor UI reached only via Traefik at node-red:1880, gated
    # by the same authentik-auth forward-auth middleware as the dashboard
    # (see nodered.home router in dynamic.yml). Flows load read-only from
    # the repo file; edits made in the browser editor don't persist across
    # container recreation unless committed back to node-red/flow.json.
    # Tightest hardening in this file: flows run arbitrary JS by design, so
    # this is the container most worth capping if a flow (or the editor,
    # once authenticated) goes rogue or gets abused.
    mem_limit: 512m
    cpus: 1.0
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks: [edge]

  authentik-redis:
    image: redis:7.4.2-alpine
    command: --save 60 1 --loglevel warning
    volumes:
      - authentik_redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    networks: [data]

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    command: server
    # Image ships its own baked-in HEALTHCHECK (ak healthcheck) — no
    # compose-level healthcheck: needed/added here.
    depends_on:
      authentik-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__USER: authentik_svc
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      # Global (not per-outpost) equivalent of the outpost blueprint's
      # authentik_host_browser config attr. Verified empirically that it
      # is NOT what fixes the browser-facing OAuth2 authorize redirect for
      # the embedded outpost (that's the outpost's own `authentik_host` —
      # see dashboard-proxy-provider.yaml) — kept here as a harmless,
      # possibly-relevant-elsewhere default matching that same value.
      AUTHENTIK_HOST_BROWSER: https://auth.home
    volumes:
      - authentik_media:/media
      - authentik_certs:/certs
      - ./authentik/blueprints:/blueprints/custom:ro
    restart: unless-stopped
    # No ports: — reached only via Traefik at authentik-server:9000.
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks: [edge, data]

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    command: worker
    depends_on:
      authentik-redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      # Same as authentik-server, INCLUDING bootstrap vars — the worker performs
      # first-boot bootstrap, not the server process. (Unchanged reasoning from
      # the prior plan.)
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_POSTGRESQL__HOST: postgres
      AUTHENTIK_POSTGRESQL__PORT: 5432
      AUTHENTIK_POSTGRESQL__USER: authentik_svc
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASSWORD}
      AUTHENTIK_POSTGRESQL__NAME: authentik_db
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_BOOTSTRAP_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL}
      AUTHENTIK_BOOTSTRAP_PASSWORD: ${AUTHENTIK_BOOTSTRAP_PASSWORD}
      AUTHENTIK_BOOTSTRAP_TOKEN: ${AUTHENTIK_BOOTSTRAP_TOKEN}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_DISABLE_UPDATE_CHECK: "true"
      AUTHENTIK_HOST_BROWSER: https://auth.home
    volumes:
      - authentik_media:/media
      - ./authentik/blueprints:/blueprints/custom:ro
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    security_opt:
      - no-new-privileges:true
    networks: [data]

  traefik:
    image: traefik:v3.7.10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./authentik/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./authentik/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./authentik/traefik/certs:/etc/traefik/certs:ro
      - ./authentik/traefik/logs:/var/log/traefik
    depends_on:
      authentik-server:
        condition: service_started
      client:
        condition: service_healthy
      node-red:
        condition: service_started
    restart: unless-stopped
    # No /var/run/docker.sock — unchanged reasoning, file provider only.
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    networks: [edge]

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    # internal: true removed 2026-08-19 — Docker's isolation chain for it
    # (DOCKER-INTERNAL) applied its DROP rules unscoped to any bridge
    # interface, so it was blocking all new inter-container connections on
    # the separate edge network too (traefik -> authentik-server forward-
    # auth timing out, 500s on every dashboard request). No member
    # currently needs internet egress (error reporting/update checks
    # disabled, no SMTP configured — see .env.example) and nothing on this
    # network publishes a host port, so removing the flag doesn't expose
    # anything new — it only stops Docker from blocking egress no one uses.

volumes:
  pg_data:
  authentik_redis_data:
  authentik_media:
  authentik_certs:
