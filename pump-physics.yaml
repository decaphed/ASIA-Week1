# ─────────────────────────────────────────────────────────────────────────
# pump-physics.yaml — plausible physical ranges for a pump, shared by both
# server/ (hard-reject at ingest, server/utils/validation.js) and pdm/
# (soft-annotate physics validation, pdm/app/preprocessing/validator.py).
#
# Single source of truth for RANGES, replacing what used to be a hardcoded
# object duplicated in both languages — see
# docs/plan/2026-08-05-pdm-implementation.md §11.5 item 3 / §11.6.1.
#
# PROVISIONAL, same status as pdm/app/thresholds.yaml: ranges are wider than
# the simulator's normal output so occasional fault-condition spikes still
# pass; not yet validated against real OT/instrumentation data.
# ─────────────────────────────────────────────────────────────────────────

version: "1"

metrics:
  flowRate:          { min: 0, max: 500 }   # L/min
  rpm:                { min: 0, max: 5000 }  # revolutions/minute
  vibration:          { min: 0, max: 25 }    # mm/s
  suctionPressure:    { min: 0, max: 10 }    # bar
  dischargePressure:  { min: 0, max: 25 }    # bar
  motorTemp:          { min: 0, max: 150 }   # °C
