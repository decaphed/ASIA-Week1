# ─────────────────────────────────────────────────────────────────────────
# thresholds.yaml — Tier 1 rule-engine thresholds (docs/plan/2026-08-05-pdm-
# implementation.md §3.1.1). Every value here is a PROVISIONAL PLACEHOLDER,
# not validated against real fault data — retune as HITL confirms/rejects
# events over time. Bump `version` on every retune; fault_events.thresholds
# Version (Node-side) is read verbatim from this field.
#
# Migrated from the pump domain to the engine domain per
# docs/plan/2026-08-26-pump-to-engine-migration.md Phase 1. Bumped to
# version "2" to mark this migration.
#
# Sourcing, per column:
#   min / max        — engine-physics.yaml's RANGES (physically-possible
#                       hard bounds, derived from
#                       docs/analysis/2026-08-26-train-csv-characterization.md).
#   stdDevMax         — 15% of the metric's normal *operating* span (Phase 0
#                       characterization's p1-p99 band, the same source that
#                       will feed server/services/driftService.js's
#                       OPERATING_RANGE in Phase 3): a window whose raw std
#                       dev exceeds that is reasoned to be unusually noisy
#                       for normal operation.
#   rateOfChangeMax   — PLACEHOLDER, NOT yet derivable. data/train.csv has no
#                       timestamp column (plan §3), so there is no tick-to-
#                       tick rate of change to measure empirically — unlike
#                       min/max/stdDevMax, which can be derived from the
#                       static distribution alone. Seeded here at 10% of each
#                       metric's Phase 0 operating span purely as an interim
#                       placeholder (same heuristic shape the old pump file
#                       used), and MUST be re-derived once the Phase 5
#                       engine simulator emits real time-series output
#                       (plan §7 Phase 5.3) — treat every value below as
#                       provisional until then, more so than the others.
# ─────────────────────────────────────────────────────────────────────────

