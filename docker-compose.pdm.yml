# PdM Python service, packaged as its own compose file so it can be deployed
# to a dedicated pdm-python CT independently of server/client (§1, §4.4) —
# same split-file convention as docker-compose.backend.yml /
# docker-compose.frontend.yml. Standing up that CT is manual operator work,
# not something this repo automates.
services:
  pdm:
    build: ./pdm
    ports:
      - "8000:8000"
    restart: unless-stopped
